<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Color Palette Mixer 🎨</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: #f8fafc;
      padding: 25px 15px;
      transition: background 0.4s ease;
    }

    .main-card {
      width: 100%;
      max-width: 1050px;
      margin: auto;
      background: white;
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
    }

    .heading {
      font-weight: 700;
      color: #0f172a;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    .palette-preview {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 260px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }

    .color-column {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 18px 5px;
      min-width: 0;
      transition: 0.4s ease;
    }

    .color-column:hover {
      transform: scaleY(1.04);
    }

    .color-code {
      background: rgba(255, 255, 255, 0.9);
      color: #111827;
      padding: 8px 5px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      width: 100%;
      cursor: pointer;
      border: none;
    }

    .color-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 17px;
      padding: 15px;
    }

    .picker-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="color"] {
      width: 58px;
      height: 58px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 14px;
    }

    .hex-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 9px;
      font-size: 13px;
      text-transform: uppercase;
      outline: none;
    }

    .hex-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .main-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .main-btn:hover {
      transform: translateY(-3px);
    }

    .random-btn {
      background: #6366f1;
      color: white;
    }

    .copy-btn {
      background: #10b981;
      color: white;
    }

    .reset-btn {
      background: #ef4444;
      color: white;
    }

    .small-copy {
      border: none;
      background: #e2e8f0;
      color: #334155;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
    }

    .small-copy:hover {
      background: #cbd5e1;
    }

    .status {
      color: #64748b;
      font-size: 13px;
    }

    .saved-palette {
      display: flex;
      height: 50px;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .saved-palette div {
      flex: 1;
    }

    @media (max-width: 576px) {
      .main-card {
        padding: 20px;
      }

      .palette-preview {
        height: 190px;
      }

      .color-code {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="main-card">

    <div class="text-center mb-4">
      <h1 class="heading">Color Palette Mixer 🎨</h1>

      <p class="subtitle">
        Mix colors, create beautiful palettes and copy your favorite HEX codes.
      </p>
    </div>

    <!-- Palette Preview -->
    <div class="palette-preview" id="palettePreview">

      <div class="color-column" id="column0">
        <button class="color-code" data-copy-index="0">
          #FF6B6B
        </button>
      </div>

      <div class="color-column" id="column1">
        <button class="color-code" data-copy-index="1">
          #FFD93D
        </button>
      </div>

      <div class="color-column" id="column2">
        <button class="color-code" data-copy-index="2">
          #6BCB77
        </button>
      </div>

      <div class="color-column" id="column3">
        <button class="color-code" data-copy-index="3">
          #4D96FF
        </button>
      </div>

      <div class="color-column" id="column4">
        <button class="color-code" data-copy-index="4">
          #845EC2
        </button>
      </div>

    </div>

    <!-- Buttons -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
      <button class="main-btn random-btn" id="randomBtn">
        🎲 Random Palette
      </button>

      <button class="main-btn copy-btn" id="copyAllBtn">
        📋 Copy All Colors
      </button>

      <button class="main-btn reset-btn" id="resetBtn">
        🔄 Reset
      </button>
    </div>

    <p class="status text-center mt-3" id="status">
      Click any color code to copy it.
    </p>

    <!-- Color Pickers -->
    <div class="row g-3 mt-2">

      <div class="col-md-6">
        <div class="color-card">
          <div class="picker-wrapper">
            <input type="color" id="color0" value="#FF6B6B" />

            <div class="flex-grow-1">
              <label class="fw-semibold small">Color 1</label>

              <input
                type="text"
                class="hex-input mt-2"
                id="hex0"
                value="#FF6B6B"
                maxlength="7"
              />
            </div>

            <button class="small-copy" data-copy-index="0">
              Copy
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="color-card">
          <div class="picker-wrapper">
            <input type="color" id="color1" value="#FFD93D" />

            <div class="flex-grow-1">
              <label class="fw-semibold small">Color 2</label>

              <input
                type="text"
                class="hex-input mt-2"
                id="hex1"
                value="#FFD93D"
                maxlength="7"
              />
            </div>

            <button class="small-copy" data-copy-index="1">
              Copy
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="color-card">
          <div class="picker-wrapper">
            <input type="color" id="color2" value="#6BCB77" />

            <div class="flex-grow-1">
              <label class="fw-semibold small">Color 3</label>

              <input
                type="text"
                class="hex-input mt-2"
                id="hex2"
                value="#6BCB77"
                maxlength="7"
              />
            </div>

            <button class="small-copy" data-copy-index="2">
              Copy
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="color-card">
          <div class="picker-wrapper">
            <input type="color" id="color3" value="#4D96FF" />

            <div class="flex-grow-1">
              <label class="fw-semibold small">Color 4</label>

              <input
                type="text"
                class="hex-input mt-2"
                id="hex3"
                value="#4D96FF"
                maxlength="7"
              />
            </div>

            <button class="small-copy" data-copy-index="3">
              Copy
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-6 mx-md-auto">
        <div class="color-card">
          <div class="picker-wrapper">
            <input type="color" id="color4" value="#845EC2" />

            <div class="flex-grow-1">
              <label class="fw-semibold small">Color 5</label>

              <input
                type="text"
                class="hex-input mt-2"
                id="hex4"
                value="#845EC2"
                maxlength="7"
              />
            </div>

            <button class="small-copy" data-copy-index="4">
              Copy
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Palette Name -->
    <div class="mt-4">
      <label for="paletteName" class="form-label fw-semibold">
        Palette Name
      </label>

      <input
        type="text"
        id="paletteName"
        class="form-control"
        placeholder="Example: Sunset Vibes"
      />
    </div>

    <div class="mt-3">
      <button class="main-btn random-btn w-100" id="saveBtn">
        💾 Save Palette
      </button>
    </div>

    <!-- Saved Palettes -->
    <div class="mt-4">
      <h5 class="fw-semibold">Saved Palettes</h5>

      <div id="savedPalettes" class="mt-3">
        <p class="status">No saved palettes yet.</p>
      </div>
    </div>

  </div>

  <script>
    const defaultColors = [
      "#FF6B6B",
      "#FFD93D",
      "#6BCB77",
      "#4D96FF",
      "#845EC2"
    ];

    let colors = [...defaultColors];
    let savedPalettes = [];

    const statusElement = document.getElementById("status");
    const paletteName = document.getElementById("paletteName");
    const savedPalettesElement =
      document.getElementById("savedPalettes");

    function updatePalette() {
      colors.forEach((color, index) => {
        const column = document.getElementById(`column${index}`);
        const colorPicker = document.getElementById(`color${index}`);
        const hexInput = document.getElementById(`hex${index}`);

        column.style.backgroundColor = color;
        colorPicker.value = color;
        hexInput.value = color;

        column.querySelector(".color-code").textContent = color;
      });

      document.body.style.background = `
        linear-gradient(
          135deg,
          ${colors[0]}22,
          ${colors[2]}22,
          ${colors[4]}22
        )
      `;
    }

    function isValidHex(value) {
      return /^#[0-9A-F]{6}$/i.test(value);
    }

    function showStatus(message) {
      statusElement.textContent = message;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showStatus(`${text} copied successfully! ✅`);
      } catch (error) {
        showStatus("Copy failed. Please copy manually.");
      }
    }

    function randomColor() {
      const characters = "0123456789ABCDEF";
      let color = "#";

      for (let i = 0; i < 6; i++) {
        color += characters[
          Math.floor(Math.random() * characters.length)
        ];
      }

      return color;
    }

    function generateRandomPalette() {
      colors = colors.map(() => randomColor());
      updatePalette();
      showStatus("New random palette generated! 🎨");
    }

    function resetPalette() {
      colors = [...defaultColors];
      paletteName.value = "";
      updatePalette();
      showStatus("Palette reset successfully.");
    }

    function savePalette() {
      const name =
        paletteName.value.trim() ||
        `My Palette ${savedPalettes.length + 1}`;

      savedPalettes.push({
        name: name,
        colors: [...colors]
      });

      renderSavedPalettes();

      paletteName.value = "";

      showStatus("Palette saved successfully! 💾");
    }

    function renderSavedPalettes() {
      if (savedPalettes.length === 0) {
        savedPalettesElement.innerHTML =
          '<p class="status">No saved palettes yet.</p>';

        return;
      }

      savedPalettesElement.innerHTML = savedPalettes
        .map((palette, index) => {
          return `
            <div class="color-card mb-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <strong>${palette.name}</strong>

                <button
                  class="small-copy delete-palette"
                  data-delete-index="${index}"
                >
                  Delete
                </button>
              </div>

              <div class="saved-palette" data-load-index="${index}">
                ${palette.colors
                  .map(
                    (color) =>
                      `<div style="background:${color}" title="${color}"></div>`
                  )
                  .join("")}
              </div>

              <p class="status mt-2 mb-0">
                ${palette.colors.join(" • ")}
              </p>
            </div>
          `;
        })
        .join("");

      document.querySelectorAll(".delete-palette").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.deleteIndex);

          savedPalettes.splice(index, 1);
          renderSavedPalettes();

          showStatus("Saved palette deleted.");
        });
      });

      document.querySelectorAll(".saved-palette").forEach((paletteBox) => {
        paletteBox.addEventListener("click", () => {
          const index = Number(paletteBox.dataset.loadIndex);

          colors = [...savedPalettes[index].colors];

          updatePalette();

          showStatus("Saved palette loaded! 🎨");
        });
      });
    }

    document.querySelectorAll('input[type="color"]').forEach((input) => {
      input.addEventListener("input", () => {
        const index = Number(input.id.replace("color", ""));

        colors[index] = input.value.toUpperCase();

        updatePalette();
      });
    });

    document.querySelectorAll(".hex-input").forEach((input) => {
      input.addEventListener("change", () => {
        const index = Number(input.id.replace("hex", ""));
        const value = input.value.toUpperCase();

        if (!isValidHex(value)) {
          showStatus("Please enter a valid HEX code like #FF6B6B.");
          input.value = colors[index];
          return;
        }

        colors[index] = value;
        updatePalette();
      });
    });

    document.querySelectorAll("[data-copy-index]").forEach((button) => {
      button.addEventListener("click", () => {
        const index = Number(button.dataset.copyIndex);
        copyText(colors[index]);
      });
    });

    document
      .getElementById("randomBtn")
      .addEventListener("click", generateRandomPalette);

    document
      .getElementById("copyAllBtn")
      .addEventListener("click", () => {
        copyText(colors.join(", "));
      });

    document
      .getElementById("resetBtn")
      .addEventListener("click", resetPalette);

    document
      .getElementById("saveBtn")
      .addEventListener("click", savePalette);

    updatePalette();
  </script>

</body>
</html>
