<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stopwatch App</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .stopwatch-card {
      width: 100%;
      max-width: 650px;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    .watch-icon {
      font-size: 55px;
      color: #20c997;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
    }

    .subtitle {
      color: #c7c7c7;
      font-size: 14px;
    }

    .time-display {
      margin: 35px 0;
      padding: 28px 15px;
      text-align: center;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    #display {
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
    }

    .status {
      color: #20c997;
      font-size: 13px;
      margin-top: 10px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-custom {
      min-width: 115px;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-custom:hover {
      transform: translateY(-3px);
    }

    .start-btn {
      background: #20c997;
      color: white;
    }

    .pause-btn {
      background: #ffc107;
      color: #111;
    }

    .lap-btn {
      background: #0dcaf0;
      color: #111;
    }

    .reset-btn {
      background: #dc3545;
      color: white;
    }

    .laps-section {
      margin-top: 35px;
    }

    .laps-heading {
      font-size: 19px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 12px;
    }

    .lap-list {
      max-height: 250px;
      overflow-y: auto;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 12px 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e5e5;
      font-size: 14px;
    }

    .lap-number {
      color: #20c997;
      font-weight: 600;
    }

    .empty-laps {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 15px;
    }

    .shortcuts {
      color: #aaa;
      text-align: center;
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.8;
    }

    kbd {
      background: #333;
      color: white;
      padding: 3px 7px;
      border-radius: 5px;
    }

    @media (max-width: 576px) {
      .stopwatch-card {
        padding: 28px 20px;
      }

      .title {
        font-size: 27px;
      }

      #display {
        font-size: 38px;
        letter-spacing: 1px;
      }

      .btn-custom {
        min-width: 105px;
        padding: 10px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="stopwatch-card">

    <!-- Heading -->
    <div class="text-center">

      <div class="watch-icon">
        <i class="bi bi-stopwatch"></i>
      </div>

      <h1 class="title">
        Stopwatch
      </h1>

      <p class="subtitle">
        Track your time with precision.
      </p>

    </div>


    <!-- Time Display -->
    <div class="time-display">

      <div id="display">
        00:00:00.00
      </div>

      <div class="status" id="status">
        Ready to start
      </div>

    </div>


    <!-- Buttons -->
    <div class="buttons">

      <button
        class="btn-custom start-btn"
        id="startButton"
        onclick="startStopwatch()"
      >
        <i class="bi bi-play-fill"></i>
        Start
      </button>

      <button
        class="btn-custom pause-btn"
        onclick="pauseStopwatch()"
      >
        <i class="bi bi-pause-fill"></i>
        Pause
      </button>

      <button
        class="btn-custom lap-btn"
        onclick="recordLap()"
      >
        <i class="bi bi-flag-fill"></i>
        Lap
      </button>

      <button
        class="btn-custom reset-btn"
        onclick="resetStopwatch()"
      >
        <i class="bi bi-arrow-counterclockwise"></i>
        Reset
      </button>

    </div>


    <!-- Lap History -->
    <div class="laps-section">

      <h3 class="laps-heading">
        <i class="bi bi-list-ol"></i>
        Lap History
      </h3>

      <ul class="lap-list" id="lapList">

        <li class="empty-laps" id="emptyLaps">
          No laps recorded yet.
        </li>

      </ul>

    </div>


    <!-- Keyboard Shortcuts -->
    <div class="shortcuts">

      <div>
        <kbd>Space</kbd>
        Start/Pause
      </div>

      <div>
        <kbd>R</kbd>
        Reset
        &nbsp;&nbsp;
        <kbd>L</kbd>
        Lap
      </div>

    </div>

  </div>


  <script>

    let startTime = 0;

    let elapsedTime = 0;

    let timerInterval = null;

    let isRunning = false;

    let lapCounter = 0;


    const display =
      document.getElementById("display");

    const statusText =
      document.getElementById("status");

    const lapList =
      document.getElementById("lapList");

    const emptyLaps =
      document.getElementById("emptyLaps");


    // Format time
    function formatTime(time) {

      const milliseconds =
        Math.floor((time % 1000) / 10);

      const totalSeconds =
        Math.floor(time / 1000);

      const seconds =
        totalSeconds % 60;

      const minutes =
        Math.floor(totalSeconds / 60) % 60;

      const hours =
        Math.floor(totalSeconds / 3600);


      return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0") +
        "." +
        String(milliseconds).padStart(2, "0")
      );

    }


    // Update display
    function updateDisplay() {

      if (isRunning) {

        elapsedTime =
          Date.now() - startTime;

      }


      display.textContent =
        formatTime(elapsedTime);

    }


    // Start stopwatch
    function startStopwatch() {

      if (isRunning) {
        return;
      }


      startTime =
        Date.now() - elapsedTime;


      timerInterval =
        setInterval(updateDisplay, 10);


      isRunning = true;

      statusText.textContent =
        "Stopwatch is running...";

    }


    // Pause stopwatch
    function pauseStopwatch() {

      if (!isRunning) {
        return;
      }


      elapsedTime =
        Date.now() - startTime;


      clearInterval(timerInterval);

      timerInterval = null;

      isRunning = false;

      updateDisplay();


      statusText.textContent =
        "Stopwatch paused";

    }


    // Record lap
    function recordLap() {

      if (elapsedTime === 0 && !isRunning) {

        statusText.textContent =
          "Start the stopwatch before recording a lap.";

        return;

      }


      if (isRunning) {

        elapsedTime =
          Date.now() - startTime;

      }


      lapCounter++;


      const lapItem =
        document.createElement("li");

      lapItem.className = "lap-item";


      lapItem.innerHTML = `

        <span>
          <span class="lap-number">
            Lap ${lapCounter}
          </span>
        </span>

        <span>
          ${formatTime(elapsedTime)}
        </span>

      `;


      emptyLaps.style.display = "none";

      lapList.prepend(lapItem);

    }


    // Reset stopwatch
    function resetStopwatch() {

      clearInterval(timerInterval);

      timerInterval = null;

      startTime = 0;

      elapsedTime = 0;

      isRunning = false;

      lapCounter = 0;


      display.textContent =
        "00:00:00.00";


      statusText.textContent =
        "Ready to start";


      lapList.innerHTML = `

        <li class="empty-laps" id="emptyLaps">
          No laps recorded yet.
        </li>

      `;

    }


    // Keyboard shortcuts
    document.addEventListener("keydown", function(event) {

      // Ignore shortcuts while typing
      if (
        event.target.tagName === "INPUT" ||
        event.target.tagName === "TEXTAREA"
      ) {
        return;
      }


      if (event.code === "Space") {

        event.preventDefault();

        if (isRunning) {
          pauseStopwatch();
        } else {
          startStopwatch();
        }

      }


      if (event.key.toLowerCase() === "r") {

        resetStopwatch();

      }


      if (event.key.toLowerCase() === "l") {

        recordLap();

      }

    });

  </script>

</body>
</html>
