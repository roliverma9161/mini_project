<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather UI App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #ffffff;
        }

        .weather-wrapper {
            min-height: 100vh;
            padding: 35px 15px;
        }

        .app-title {
            font-size: 2rem;
            font-weight: 700;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
        }

        .search-box {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
            padding: 8px;
            backdrop-filter: blur(12px);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            box-shadow: none !important;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.75);
        }

        .search-box button {
            border-radius: 12px;
            font-weight: 600;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .location {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .date-text {
            color: rgba(255, 255, 255, 0.8);
        }

        .weather-icon {
            width: 130px;
            height: 130px;
        }

        .temperature {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
        }

        .weather-description {
            font-size: 1.2rem;
            text-transform: capitalize;
            color: rgba(255, 255, 255, 0.9);
        }

        .weather-info {
            background: rgba(255, 255, 255, 0.13);
            border-radius: 18px;
            padding: 20px 10px;
            height: 100%;
        }

        .weather-info i {
            font-size: 1.8rem;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
        }

        .forecast-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.13);
            border-radius: 18px;
            padding: 18px 8px;
            text-align: center;
            height: 100%;
        }

        .forecast-card img {
            width: 65px;
        }

        .forecast-day {
            font-weight: 600;
        }

        .forecast-temp {
            font-weight: 600;
        }

        .loading {
            display: none;
        }

        .error-message {
            display: none;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
        }

        @media (max-width: 576px) {
            .app-title {
                font-size: 1.5rem;
            }

            .temperature {
                font-size: 4rem;
            }

            .weather-icon {
                width: 100px;
                height: 100px;
            }

            .location {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="weather-wrapper">

        <div class="container">

            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="app-title">
                    <i class="bi bi-cloud-sun"></i>
                    Weather UI App
                </h1>

                <p class="subtitle">
                    Check live weather of any city
                </p>
            </div>

            <!-- Search -->
            <div class="row justify-content-center mb-4">
                <div class="col-lg-7 col-md-9">

                    <div class="search-box d-flex gap-2">
                        <input
                            type="text"
                            id="cityInput"
                            class="form-control"
                            placeholder="Enter city name..."
                            value="Delhi">

                        <button
                            class="btn btn-light px-4"
                            onclick="searchWeather()">
                            <i class="bi bi-search"></i>
                            Search
                        </button>
                    </div>

                </div>
            </div>

            <!-- Error -->
            <div class="row justify-content-center mb-3">
                <div class="col-lg-7 col-md-9">
                    <div id="errorMessage" class="error-message text-center">
                        City not found. Please enter a valid city name.
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading text-center mb-4">
                <div class="spinner-border text-light"></div>
                <p class="mt-2">Loading weather...</p>
            </div>

            <!-- Main Weather Card -->
            <div id="weatherContent">

                <div class="glass-card p-4 mb-4">

                    <div class="text-center mb-4">
                        <div id="location" class="location">
                            New Delhi, IN
                        </div>

                        <div id="date" class="date-text">
                            Monday, 12 September 2026
                        </div>
                    </div>

                    <div class="row align-items-center">

                        <div class="col-md-6 text-center">

                            <img
                                id="weatherIcon"
                                class="weather-icon"
                                src="https://openweathermap.org/img/wn/01d@4x.png"
                                alt="Weather Icon">

                            <div id="temperature" class="temperature">
                                28°
                            </div>

                            <div id="weatherDescription"
                                class="weather-description">
                                Clear Sky
                            </div>

                            <p class="mt-2 mb-0">
                                Feels like
                                <span id="feelsLike">30</span>°C
                            </p>

                        </div>

                        <div class="col-md-6 mt-4 mt-md-0">

                            <div class="row g-3">

                                <div class="col-6">
                                    <div class="weather-info text-center">
                                        <i class="bi bi-droplet"></i>

                                        <div id="humidity"
                                            class="info-value">
                                            65%
                                        </div>

                                        <div class="info-label">
                                            Humidity
                                        </div>
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="weather-info text-center">
                                        <i class="bi bi-wind"></i>

                                        <div id="wind"
                                            class="info-value">
                                            4.5 m/s
                                        </div>

                                        <div class="info-label">
                                            Wind Speed
                                        </div>
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="weather-info text-center">
                                        <i class="bi bi-speedometer2"></i>

                                        <div id="pressure"
                                            class="info-value">
                                            1012 hPa
                                        </div>

                                        <div class="info-label">
                                            Pressure
                                        </div>
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="weather-info text-center">
                                        <i class="bi bi-eye"></i>

                                        <div id="visibility"
                                            class="info-value">
                                            10 km
                                        </div>

                                        <div class="info-label">
                                            Visibility
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Forecast -->
                <div class="glass-card p-4">

                    <h2 class="forecast-title mb-4">
                        <i class="bi bi-calendar-week"></i>
                        5-Day Forecast
                    </h2>

                    <div id="forecastContainer"
                        class="row g-3">

                        <!-- Forecast cards will appear here -->

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        /*
            OpenWeatherMap API Key yahan paste karein.
            Example:
            const API_KEY = "your_api_key_here";
        */

        const API_KEY = "YOUR_API_KEY_HERE";

        const cityInput = document.getElementById("cityInput");
        const errorMessage = document.getElementById("errorMessage");
        const loading = document.getElementById("loading");
        const weatherContent = document.getElementById("weatherContent");

        cityInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                searchWeather();
            }
        });

        function showLoading(status) {
            loading.style.display = status ? "block" : "none";
        }

        function showError(message) {
            errorMessage.innerText = message;
            errorMessage.style.display = "block";
        }

        function hideError() {
            errorMessage.style.display = "none";
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);

            return date.toLocaleDateString("en-IN", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        async function searchWeather() {

            const city = cityInput.value.trim();

            if (city === "") {
                showError("Please enter a city name.");
                return;
            }

            if (API_KEY === "YOUR_API_KEY_HERE") {
                showError("Please add your OpenWeatherMap API key in JavaScript.");
                return;
            }

            hideError();
            showLoading(true);

            try {

                const currentWeatherURL =
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`;

                const forecastURL =
                    `https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${API_KEY}`;

                const currentResponse =
                    await fetch(currentWeatherURL);

                const forecastResponse =
                    await fetch(forecastURL);

                if (!currentResponse.ok || !forecastResponse.ok) {
                    throw new Error("City not found");
                }

                const currentData =
                    await currentResponse.json();

                const forecastData =
                    await forecastResponse.json();

                updateCurrentWeather(currentData);
                updateForecast(forecastData);

            } catch (error) {

                showError(
                    "Unable to fetch weather. Please check city name or API key."
                );

            } finally {

                showLoading(false);

            }
        }

        function updateCurrentWeather(data) {

            document.getElementById("location").innerText =
                `${data.name}, ${data.sys.country}`;

            document.getElementById("date").innerText =
                formatDate(data.dt);

            document.getElementById("weatherIcon").src =
                `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;

            document.getElementById("weatherIcon").alt =
                data.weather[0].description;

            document.getElementById("temperature").innerText =
                `${Math.round(data.main.temp)}°`;

            document.getElementById("weatherDescription").innerText =
                data.weather[0].description;

            document.getElementById("feelsLike").innerText =
                Math.round(data.main.feels_like);

            document.getElementById("humidity").innerText =
                `${data.main.humidity}%`;

            document.getElementById("wind").innerText =
                `${data.wind.speed} m/s`;

            document.getElementById("pressure").innerText =
                `${data.main.pressure} hPa`;

            document.getElementById("visibility").innerText =
                `${(data.visibility / 1000).toFixed(1)} km`;
        }

        function updateForecast(data) {

            const forecastContainer =
                document.getElementById("forecastContainer");

            forecastContainer.innerHTML = "";

            /*
                API 3-hour forecast deta hai.
                Har 8th item approximately next day ko represent karega.
            */

            const dailyForecasts = data.list.filter((item, index) => {
                return index % 8 === 0;
            }).slice(0, 5);

            dailyForecasts.forEach(item => {

                const date = new Date(item.dt * 1000);

                const dayName = date.toLocaleDateString("en-IN", {
                    weekday: "short"
                });

                const iconURL =
                    `https://openweathermap.org/img/wn/${item.weather[0].icon}@2x.png`;

                const card = `
                    <div class="col-6 col-md">
                        <div class="forecast-card">
                            <div class="forecast-day">
                                ${dayName}
                            </div>

                            <img
                                src="${iconURL}"
                                alt="Weather Icon">

                            <div class="forecast-temp">
                                ${Math.round(item.main.temp)}°C
                            </div>

                            <small>
                                ${item.weather[0].main}
                            </small>
                        </div>
                    </div>
                `;

                forecastContainer.innerHTML += card;
            });
        }

        /*
            Demo data show karne ke liye initial UI.
            API key add karne ke baad ye line uncomment karein:

            searchWeather();
        */
    </script>

</body>

</html>
