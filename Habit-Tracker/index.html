<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habit Tracker App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8);
            color: #1f2937;
        }

        .app-wrapper {
            min-height: 100vh;
            padding: 35px 15px;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            color: #4f46e5;
        }

        .subtitle {
            color: #6b7280;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.08);
        }

        .stat-card {
            padding: 22px;
            height: 100%;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 1.4rem;
        }

        .purple-icon {
            background: #ede9fe;
            color: #7c3aed;
        }

        .green-icon {
            background: #dcfce7;
            color: #16a34a;
        }

        .orange-icon {
            background: #ffedd5;
            color: #ea580c;
        }

        .blue-icon {
            background: #dbeafe;
            color: #2563eb;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 12px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .section-title {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .form-control,
        .form-select {
            border-radius: 13px;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .btn-primary {
            background: #4f46e5;
            border-color: #4f46e5;
            border-radius: 13px;
            padding: 12px 20px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        .filter-btn {
            border-radius: 12px;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #4f46e5;
            color: white;
        }

        .habit-item {
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 15px;
            background: #ffffff;
            transition: 0.3s ease;
        }

        .habit-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .habit-item.completed {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .habit-check {
            width: 28px;
            height: 28px;
            cursor: pointer;
            accent-color: #16a34a;
        }

        .habit-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .habit-item.completed .habit-name {
            color: #15803d;
            text-decoration: line-through;
        }

        .habit-meta {
            color: #6b7280;
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .category-badge {
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .streak-badge {
            background: #fff7ed;
            color: #ea580c;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            width: 38px;
            height: 38px;
            border-radius: 12px;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .progress {
            height: 12px;
            border-radius: 20px;
            background: #e5e7eb;
        }

        .progress-bar {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 45px 15px;
            color: #9ca3af;
        }

        .empty-state i {
            font-size: 3rem;
            color: #c7d2fe;
        }

        .date-label {
            font-size: 0.9rem;
            color: #6b7280;
        }

        @media (max-width: 576px) {
            .main-title {
                font-size: 1.6rem;
            }

            .stat-card {
                padding: 17px;
            }

            .stat-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="app-wrapper">

        <div class="container">

            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="main-title">
                    <i class="bi bi-check2-circle"></i>
                    Habit Tracker
                </h1>

                <p class="subtitle">
                    Build better habits, one day at a time.
                </p>
            </div>

            <!-- Date -->
            <div class="text-center mb-4">
                <span class="date-label">
                    <i class="bi bi-calendar3"></i>
                    <span id="todayDate"></span>
                </span>
            </div>

            <!-- Stats -->
            <div class="row g-3 mb-4">

                <div class="col-6 col-lg-3">
                    <div class="glass-card stat-card">
                        <div class="stat-icon purple-icon">
                            <i class="bi bi-list-check"></i>
                        </div>

                        <div id="totalHabits" class="stat-number">
                            0
                        </div>

                        <div class="stat-label">
                            Total Habits
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="glass-card stat-card">
                        <div class="stat-icon green-icon">
                            <i class="bi bi-check-circle"></i>
                        </div>

                        <div id="completedHabits" class="stat-number">
                            0
                        </div>

                        <div class="stat-label">
                            Completed Today
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="glass-card stat-card">
                        <div class="stat-icon orange-icon">
                            <i class="bi bi-fire"></i>
                        </div>

                        <div id="bestStreak" class="stat-number">
                            0
                        </div>

                        <div class="stat-label">
                            Best Streak
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="glass-card stat-card">
                        <div class="stat-icon blue-icon">
                            <i class="bi bi-graph-up-arrow"></i>
                        </div>

                        <div id="progressPercent" class="stat-number">
                            0%
                        </div>

                        <div class="stat-label">
                            Daily Progress
                        </div>
                    </div>
                </div>

            </div>

            <!-- Progress Card -->
            <div class="glass-card p-4 mb-4">

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="section-title mb-0">
                        Today's Progress
                    </h2>

                    <strong id="progressText">
                        0 / 0
                    </strong>
                </div>

                <div class="progress">
                    <div
                        id="progressBar"
                        class="progress-bar"
                        role="progressbar"
                        style="width: 0%">
                    </div>
                </div>

            </div>

            <!-- Add Habit -->
            <div class="glass-card p-4 mb-4">

                <h2 class="section-title mb-3">
                    <i class="bi bi-plus-circle"></i>
                    Add New Habit
                </h2>

                <form id="habitForm">

                    <div class="row g-3">

                        <div class="col-md-5">
                            <label class="form-label">
                                Habit Name
                            </label>

                            <input
                                type="text"
                                id="habitName"
                                class="form-control"
                                placeholder="e.g. Read 20 pages"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">
                                Category
                            </label>

                            <select id="habitCategory" class="form-select">
                                <option value="Health">Health</option>
                                <option value="Study">Study</option>
                                <option value="Fitness">Fitness</option>
                                <option value="Personal">Personal</option>
                                <option value="Work">Work</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">
                                Goal
                            </label>

                            <input
                                type="number"
                                id="habitGoal"
                                class="form-control"
                                min="1"
                                value="1"
                                required>
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary w-100" type="submit">
                                <i class="bi bi-plus-lg"></i>
                                Add
                            </button>
                        </div>

                    </div>

                </form>

            </div>

            <!-- Habits List -->
            <div class="glass-card p-4">

                <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">

                    <h2 class="section-title mb-0">
                        My Habits
                    </h2>

                    <div class="d-flex flex-wrap gap-2">

                        <button
                            class="btn btn-sm btn-outline-secondary filter-btn active"
                            data-filter="all">
                            All
                        </button>

                        <button
                            class="btn btn-sm btn-outline-secondary filter-btn"
                            data-filter="active">
                            Active
                        </button>

                        <button
                            class="btn btn-sm btn-outline-secondary filter-btn"
                            data-filter="completed">
                            Completed
                        </button>

                    </div>

                </div>

                <!-- Search -->
                <div class="mb-4">
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search habits...">
                </div>

                <div id="habitsContainer">
                    <!-- Habits appear here -->
                </div>

            </div>

        </div>

    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem("habitTrackerData")) || [];

        let currentFilter = "all";

        const habitForm = document.getElementById("habitForm");
        const habitName = document.getElementById("habitName");
        const habitCategory = document.getElementById("habitCategory");
        const habitGoal = document.getElementById("habitGoal");
        const habitsContainer = document.getElementById("habitsContainer");
        const searchInput = document.getElementById("searchInput");

        const todayKey = new Date().toISOString().split("T")[0];

        document.getElementById("todayDate").innerText =
            new Date().toLocaleDateString("en-IN", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

        habitForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const name = habitName.value.trim();
            const category = habitCategory.value;
            const goal = Number(habitGoal.value);

            if (name === "" || goal < 1) {
                alert("Please enter valid habit details.");
                return;
            }

            const newHabit = {
                id: Date.now(),
                name: name,
                category: category,
                goal: goal,
                completedDates: [],
                streak: 0
            };

            habits.push(newHabit);

            saveHabits();
            renderHabits();

            habitForm.reset();
            habitGoal.value = 1;
            habitName.focus();
        });

        document.querySelectorAll(".filter-btn").forEach(button => {

            button.addEventListener("click", function () {

                document.querySelectorAll(".filter-btn").forEach(btn => {
                    btn.classList.remove("active");
                });

                this.classList.add("active");

                currentFilter = this.dataset.filter;

                renderHabits();
            });

        });

        searchInput.addEventListener("input", renderHabits);

        function saveHabits() {
            localStorage.setItem("habitTrackerData", JSON.stringify(habits));
        }

        function isCompletedToday(habit) {
            return habit.completedDates.includes(todayKey);
        }

        function calculateStreak(habit) {

            let streak = 0;
            let date = new Date();

            while (true) {

                const key = date.toISOString().split("T")[0];

                if (habit.completedDates.includes(key)) {
                    streak++;
                    date.setDate(date.getDate() - 1);
                } else {
                    break;
                }
            }

            return streak;
        }

        function toggleHabit(id) {

            const habit = habits.find(item => item.id === id);

            if (!habit) return;

            if (isCompletedToday(habit)) {

                habit.completedDates =
                    habit.completedDates.filter(date => date !== todayKey);

            } else {

                habit.completedDates.push(todayKey);

            }

            habit.streak = calculateStreak(habit);

            saveHabits();
            renderHabits();
        }

        function deleteHabit(id) {

            const confirmDelete =
                confirm("Are you sure you want to delete this habit?");

            if (!confirmDelete) return;

            habits = habits.filter(habit => habit.id !== id);

            saveHabits();
            renderHabits();
        }

        function getFilteredHabits() {

            const searchText = searchInput.value.toLowerCase().trim();

            return habits.filter(habit => {

                const matchesSearch =
                    habit.name.toLowerCase().includes(searchText);

                const completed = isCompletedToday(habit);

                const matchesFilter =
                    currentFilter === "all" ||
                    (currentFilter === "active" && !completed) ||
                    (currentFilter === "completed" && completed);

                return matchesSearch && matchesFilter;
            });
        }

        function renderHabits() {

            habitsContainer.innerHTML = "";

            const filteredHabits = getFilteredHabits();

            if (filteredHabits.length === 0) {

                habitsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-journal-check"></i>
                        <h5 class="mt-3">No habits found</h5>
                        <p>Add a new habit and start your daily journey.</p>
                    </div>
                `;

            } else {

                filteredHabits.forEach(habit => {

                    const completed = isCompletedToday(habit);
                    const streak = calculateStreak(habit);

                    const habitElement = document.createElement("div");

                    habitElement.className =
                        `habit-item ${completed ? "completed" : ""}`;

                    habitElement.innerHTML = `
                        <div class="d-flex align-items-center gap-3">

                            <input
                                type="checkbox"
                                class="habit-check"
                                ${completed ? "checked" : ""}
                                onchange="toggleHabit(${habit.id})">

                            <div class="flex-grow-1">

                                <div class="d-flex flex-wrap align-items-center gap-2">
                                    <span class="habit-name">
                                        ${escapeHTML(habit.name)}
                                    </span>

                                    <span class="category-badge">
                                        ${escapeHTML(habit.category)}
                                    </span>
                                </div>

                                <div class="habit-meta">
                                    Goal: ${habit.goal} time(s) daily
                                </div>

                                <div class="mt-2">
                                    <span class="streak-badge">
                                        <i class="bi bi-fire"></i>
                                        ${streak} day streak
                                    </span>
                                </div>

                            </div>

                            <button
                                class="delete-btn"
                                onclick="deleteHabit(${habit.id})"
                                title="Delete habit">

                                <i class="bi bi-trash"></i>

                            </button>

                        </div>
                    `;

                    habitsContainer.appendChild(habitElement);
                });

            }

            updateStats();
        }

        function updateStats() {

            const total = habits.length;

            const completed = habits.filter(habit =>
                isCompletedToday(habit)
            ).length;

            const progress =
                total === 0 ? 0 : Math.round((completed / total) * 100);

            const bestStreak = habits.length === 0
                ? 0
                : Math.max(...habits.map(habit => calculateStreak(habit)));

            document.getElementById("totalHabits").innerText = total;
            document.getElementById("completedHabits").innerText = completed;
            document.getElementById("bestStreak").innerText = bestStreak;
            document.getElementById("progressPercent").innerText = `${progress}%`;

            document.getElementById("progressText").innerText =
                `${completed} / ${total}`;

            document.getElementById("progressBar").style.width =
                `${progress}%`;
        }

        function escapeHTML(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        renderHabits();
    </script>

</body>

</html>
