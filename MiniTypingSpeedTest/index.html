<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mini Typing Speed Test</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe, #fce7f3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-card {
      width: 100%;
      max-width: 950px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(79, 70, 229, 0.15);
      backdrop-filter: blur(15px);
    }

    .heading {
      color: #4f46e5;
      font-weight: 700;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
    }

    .stat-card {
      background: white;
      border-radius: 17px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;
      color: #4f46e5;
    }

    .stat-label {
      font-size: 12px;
      color: #6b7280;
    }

    .sentence-box {
      background: #eef2ff;
      border: 2px dashed #a5b4fc;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
      font-size: 20px;
      line-height: 1.8;
      color: #3730a3;
      font-weight: 500;
      min-height: 130px;
    }

    .typing-input {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 2px solid #c7d2fe;
      border-radius: 18px;
      padding: 18px;
      font-family: "Poppins", sans-serif;
      font-size: 16px;
      outline: none;
      transition: 0.3s ease;
    }

    .typing-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .main-btn {
      border: none;
      border-radius: 13px;
      padding: 13px 25px;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .main-btn:hover {
      transform: translateY(-3px);
    }

    .start-btn {
      background: #4f46e5;
      color: white;
    }

    .reset-btn {
      background: #ef4444;
      color: white;
    }

    .progress {
      height: 10px;
      border-radius: 20px;
      background: #e0e7ff;
    }

    .progress-bar {
      background: #6366f1;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .message {
      color: #6b7280;
      font-size: 13px;
    }

    .correct {
      color: #16a34a;
    }

    .wrong {
      color: #dc2626;
    }

    .result-box {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 17px;
      padding: 20px;
      margin-top: 20px;
    }

    @media (max-width: 576px) {
      .main-card {
        padding: 20px;
      }

      .sentence-box {
        font-size: 16px;
      }

      .stat-number {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="main-card">

    <div class="text-center">
      <h1 class="heading">Mini Typing Speed Test ⌨️</h1>

      <p class="subtitle">
        Type the sentence as quickly and accurately as possible.
      </p>
    </div>

    <!-- Stats -->
    <div class="row g-3 mt-3">

      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-number" id="time">30</div>
          <div class="stat-label">Seconds</div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-number" id="wpm">0</div>
          <div class="stat-label">WPM</div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-number" id="accuracy">100%</div>
          <div class="stat-label">Accuracy</div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-number" id="errors">0</div>
          <div class="stat-label">Errors</div>
        </div>
      </div>

    </div>

    <!-- Sentence -->
    <div class="sentence-box" id="sentence">
      Practice makes progress, so keep typing and never give up.
    </div>

    <!-- Progress -->
    <div class="mt-3">
      <div class="d-flex justify-content-between mb-2">
        <span class="message">Test Progress</span>
        <span class="message" id="progressText">0%</span>
      </div>

      <div class="progress">
        <div
          class="progress-bar"
          id="progressBar"
          style="width: 0%"
        ></div>
      </div>
    </div>

    <!-- Input -->
    <div class="mt-4">
      <label for="typingInput" class="form-label fw-semibold">
        Start typing here:
      </label>

      <textarea
        id="typingInput"
        class="typing-input"
        placeholder="Click Start Test and begin typing..."
        disabled
      ></textarea>
    </div>

    <!-- Buttons -->
    <div class="text-center mt-4">
      <button class="main-btn start-btn" id="startBtn">
        ▶ Start Test
      </button>

      <button class="main-btn reset-btn" id="resetBtn">
        🔄 Reset
      </button>
    </div>

    <p class="message text-center mt-3 mb-0" id="status">
      Press Start Test to begin.
    </p>

    <!-- Result -->
    <div class="result-box text-center" id="resultBox">
      <h4>🎉 Test Completed!</h4>
      <p class="mb-1">
        Your final speed:
        <strong><span id="finalWpm">0</span> WPM</strong>
      </p>

      <p class="mb-0">
        Accuracy:
        <strong><span id="finalAccuracy">0%</span></strong>
      </p>
    </div>

  </div>

  <script>
    const sentences = [
      "Practice makes progress, so keep typing and never give up.",
      "Learning JavaScript becomes easier when you practice every day.",
      "Small improvements today can create big results tomorrow.",
      "A focused mind can solve difficult problems with patience.",
      "Good developers write code, test ideas, and learn from mistakes.",
      "Consistency is more important than perfection in learning."
    ];

    const sentenceElement = document.getElementById("sentence");
    const typingInput = document.getElementById("typingInput");

    const timeElement = document.getElementById("time");
    const wpmElement = document.getElementById("wpm");
    const accuracyElement = document.getElementById("accuracy");
    const errorsElement = document.getElementById("errors");

    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusElement = document.getElementById("status");

    const resultBox = document.getElementById("resultBox");
    const finalWpm = document.getElementById("finalWpm");
    const finalAccuracy = document.getElementById("finalAccuracy");

    let currentSentence = "";
    let timeLeft = 30;
    let timer = null;
    let started = false;
    let finished = false;

    function chooseSentence() {
      const randomIndex = Math.floor(
        Math.random() * sentences.length
      );

      currentSentence = sentences[randomIndex];
      sentenceElement.textContent = currentSentence;
    }

    function calculateStats() {
      const typedText = typingInput.value;

      let correctCharacters = 0;
      let errors = 0;

      for (let i = 0; i < typedText.length; i++) {
        if (typedText[i] === currentSentence[i]) {
          correctCharacters++;
        } else {
          errors++;
        }
      }

      const totalTyped = typedText.length;

      const accuracy =
        totalTyped === 0
          ? 100
          : Math.round((correctCharacters / totalTyped) * 100);

      const elapsedSeconds = 30 - timeLeft;
      const elapsedMinutes = Math.max(elapsedSeconds / 60, 1 / 60);

      const wordsTyped = typedText.trim().length / 5;
      const wpm = Math.round(wordsTyped / elapsedMinutes);

      const progress = Math.min(
        Math.round((typedText.length / currentSentence.length) * 100),
        100
      );

      wpmElement.textContent = wpm;
      accuracyElement.textContent = accuracy + "%";
      errorsElement.textContent = errors;

      progressBar.style.width = progress + "%";
      progressText.textContent = progress + "%";

      if (typedText.length >= currentSentence.length) {
        finishTest();
      }
    }

    function startTest() {
      if (started && !finished) {
        return;
      }

      resetTest(false);

      started = true;
      finished = false;

      typingInput.disabled = false;
      typingInput.focus();

      startBtn.disabled = true;
      startBtn.textContent = "⏳ Test Running";

      statusElement.textContent =
        "Keep typing... timer is running!";

      timer = setInterval(() => {
        timeLeft--;
        timeElement.textContent = timeLeft;

        calculateStats();

        if (timeLeft <= 0) {
          finishTest();
        }
      }, 1000);
    }

    function finishTest() {
      if (finished) {
        return;
      }

      finished = true;
      started = false;

      clearInterval(timer);

      typingInput.disabled = true;
      startBtn.disabled = false;
      startBtn.textContent = "▶ Start Again";

      calculateStats();

      finalWpm.textContent = wpmElement.textContent;
      finalAccuracy.textContent = accuracyElement.textContent;

      resultBox.style.display = "block";

      statusElement.textContent =
        "Test finished! Try again to improve your score.";
    }

    function resetTest(changeSentence = true) {
      clearInterval(timer);

      timeLeft = 30;
      started = false;
      finished = false;

      timeElement.textContent = "30";
      wpmElement.textContent = "0";
      accuracyElement.textContent = "100%";
      errorsElement.textContent = "0";

      progressBar.style.width = "0%";
      progressText.textContent = "0%";

      typingInput.value = "";
      typingInput.disabled = true;

      startBtn.disabled = false;
      startBtn.textContent = "▶ Start Test";

      resultBox.style.display = "none";

      statusElement.textContent =
        "Press Start Test to begin.";

      if (changeSentence) {
        chooseSentence();
      }
    }

    typingInput.addEventListener("input", calculateStats);

    startBtn.addEventListener("click", startTest);

    resetBtn.addEventListener("click", () => {
      resetTest(true);
    });

    chooseSentence();
  </script>

</body>
</html>
